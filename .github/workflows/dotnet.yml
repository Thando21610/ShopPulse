name: .NET build and test

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoppulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shoppulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHOPPULSE_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=shoppulse_test;Username=postgres;Password=postgres;Pooling=false
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ShopPulse.slnx
      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.15
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$HOME/.dotnet/tools:$PATH"
      - name: Scaffold current EF model snapshot (diagnostic)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          UseSqlite: "false"
          ConnectionStrings__Default: ${{ env.SHOPPULSE_TEST_POSTGRES_CONNECTION }}
        run: |
          dotnet-ef migrations add AlignCurrentModel --project src/ShopPulse.Api/ShopPulse.Api.csproj --startup-project src/ShopPulse.Api/ShopPulse.Api.csproj --output-dir Migrations
          echo "===== GENERATED MIGRATION ====="
          cat src/ShopPulse.Api/Migrations/*_AlignCurrentModel.cs
          echo "===== GENERATED SNAPSHOT FILTERS ====="
          grep -n -A2 -B2 "HasQueryFilter" src/ShopPulse.Api/Migrations/AppDbContextModelSnapshot.cs
      - name: Build
        run: dotnet build ShopPulse.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test ShopPulse.slnx --configuration Release --no-build
      - name: Publish API
        run: dotnet publish src/ShopPulse.Api/ShopPulse.Api.csproj --configuration Release --no-restore --output artifacts/api
      - name: Publish Blazor client
        run: dotnet publish src/ShopPulse.Client/ShopPulse.Client.csproj --configuration Release --no-restore --output artifacts/client
      - name: Build API container
        run: docker build --tag shoppulse-api:ci src/ShopPulse.Api
      - name: Build frontend container
        run: docker build --tag shoppulse-client:ci src/ShopPulse.Client
